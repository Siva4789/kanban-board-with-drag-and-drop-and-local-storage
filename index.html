<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara Kanban Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Yara Board</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button id="open-add-modal-btn" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/40">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>New Task</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Board Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 items-start">
            
            <!-- Column 1: To Do -->
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl flex flex-col max-h-[calc(100vh-12rem)]">
                <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                        <h2 class="font-semibold text-slate-200">To Do</h2>
                    </div>
                    <span id="count-todo" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400">0</span>
                </div>
                <div id="todo-dropzone" class="dropzone p-4 flex-1 overflow-y-auto space-y-3" data-status="todo">
                    <!-- Tasks will be dynamically injected here -->
                </div>
                <div class="p-3 border-t border-slate-800/60">
                    <button onclick="openNewTaskModalWithStatus('todo')" class="w-full py-2 border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl text-xs font-medium text-slate-400 hover:text-indigo-400 transition flex items-center justify-center space-x-1">
                        <span>+ Add task</span>
                    </button>
                </div>
            </div>

            <!-- Column 2: In Progress -->
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl flex flex-col max-h-[calc(100vh-12rem)]">
                <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                        <h2 class="font-semibold text-slate-200">In Progress</h2>
                    </div>
                    <span id="count-inprogress" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400">0</span>
                </div>
                <div id="inprogress-dropzone" class="dropzone p-4 flex-1 overflow-y-auto space-y-3" data-status="inprogress">
                    <!-- Tasks will be dynamically injected here -->
                </div>
                <div class="p-3 border-t border-slate-800/60">
                    <button onclick="openNewTaskModalWithStatus('inprogress')" class="w-full py-2 border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl text-xs font-medium text-slate-400 hover:text-indigo-400 transition flex items-center justify-center space-x-1">
                        <span>+ Add task</span>
                    </button>
                </div>
            </div>

            <!-- Column 3: Done -->
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl flex flex-col max-h-[calc(100vh-12rem)]">
                <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h2 class="font-semibold text-slate-200">Done</h2>
                    </div>
                    <span id="count-done" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400">0</span>
                </div>
                <div id="done-dropzone" class="dropzone p-4 flex-1 overflow-y-auto space-y-3" data-status="done">
                    <!-- Tasks will be dynamically injected here -->
                </div>
                <div class="p-3 border-t border-slate-800/60">
                    <button onclick="openNewTaskModalWithStatus('done')" class="w-full py-2 border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl text-xs font-medium text-slate-400 hover:text-indigo-400 transition flex items-center justify-center space-x-1">
                        <span>+ Add task</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Task Modal (Create / Edit) -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative transform transition-all">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">Create New Task</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Task Title</label>
                    <input type="text" id="task-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="e.g., Redesign landing page">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Description</label>
                    <textarea id="task-description" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="Add optional notes or acceptance criteria..."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                        <select id="task-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Priority</label>
                        <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Script -->
    <script src="script.js"></script>
</body>
</html>
