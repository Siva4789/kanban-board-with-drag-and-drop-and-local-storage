<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARA Project Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">Project Dashboard</h1>
            <div id="header-actions">
                <!-- Placeholder for actions -->
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                    New Task
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div id="board-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Column 1: Todo -->
            <div class="bg-gray-100 rounded-xl p-4 flex flex-col h-full shadow-inner">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-gray-700 uppercase tracking-wide text-sm">To Do</h2>
                    <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="space-y-3 flex-1" id="column-todo">
                    <!-- Card Example -->
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow cursor-pointer">
                        <h3 class="font-medium text-gray-800">Sample Task Card</h3>
                        <p class="text-sm text-gray-500 mt-1">This is a placeholder description for the project layout.</p>
                    </div>
                </div>
            </div>

            <!-- Column 2: In Progress -->
            <div class="bg-gray-100 rounded-xl p-4 flex flex-col h-full shadow-inner">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-gray-700 uppercase tracking-wide text-sm">In Progress</h2>
                    <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="space-y-3 flex-1" id="column-inprogress">
                    <!-- Cards go here -->
                </div>
            </div>

            <!-- Column 3: Done -->
            <div class="bg-gray-100 rounded-xl p-4 flex flex-col h-full shadow-inner">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-gray-700 uppercase tracking-wide text-sm">Done</h2>
                    <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">0</span>
                </div>
                <div class="space-y-3 flex-1" id="column-done">
                    <!-- Cards go here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        YARA Project Management &copy; 2023
    </footer>

</body>
</html>
