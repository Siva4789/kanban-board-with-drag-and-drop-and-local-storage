<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara Kanban Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0a0f1d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-kanban text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Yara Kanban</h1>
                <p class="text-xs text-slate-400">Streamline your workflow with elegance</p>
            </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-3">
            <button id="add-task-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center space-x-2 active:scale-95">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>New Task</span>
            </button>
        </div>
    </header>

    <!-- Main Kanban Board Container -->
    <main class="flex-1 overflow-x-auto p-6 flex space-x-6 items-start">
        
        <!-- Column: Todo -->
        <div class="kanban-column shrink-0 w-80 bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl flex flex-col max-h-full shadow-xl" data-column="todo">
            <!-- Column Header -->
            <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50"></span>
                    <h2 class="font-semibold text-sm tracking-wide text-slate-200">To Do</h2>
                    <span id="count-todo" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <button class="text-slate-500 hover:text-slate-300 transition-colors p-1">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <!-- Task List Container (Drop Zone) -->
            <div class="task-list flex-1 overflow-y-auto p-3 space-y-3 min-h-[150px]" id="list-todo">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Column Footer Action -->
            <div class="p-3 border-t border-slate-800/60">
                <button onclick="openAddTaskModal('todo')" class="w-full py-2 px-3 text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-xl transition-all flex items-center justify-center space-x-2 border border-dashed border-slate-800 hover:border-slate-700">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add card</span>
                </button>
            </div>
        </div>

        <!-- Column: In Progress -->
        <div class="kanban-column shrink-0 w-80 bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl flex flex-col max-h-full shadow-xl" data-column="in-progress">
            <!-- Column Header -->
            <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500 shadow-sm shadow-blue-500/50"></span>
                    <h2 class="font-semibold text-sm tracking-wide text-slate-200">In Progress</h2>
                    <span id="count-in-progress" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <button class="text-slate-500 hover:text-slate-300 transition-colors p-1">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <!-- Task List Container (Drop Zone) -->
            <div class="task-list flex-1 overflow-y-auto p-3 space-y-3 min-h-[150px]" id="list-in-progress">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Column Footer Action -->
            <div class="p-3 border-t border-slate-800/60">
                <button onclick="openAddTaskModal('in-progress')" class="w-full py-2 px-3 text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-xl transition-all flex items-center justify-center space-x-2 border border-dashed border-slate-800 hover:border-slate-700">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add card</span>
                </button>
            </div>
        </div>

        <!-- Column: Review -->
        <div class="kanban-column shrink-0 w-80 bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl flex flex-col max-h-full shadow-xl" data-column="review">
            <!-- Column Header -->
            <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-purple-500 shadow-sm shadow-purple-500/50"></span>
                    <h2 class="font-semibold text-sm tracking-wide text-slate-200">Review</h2>
                    <span id="count-review" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <button class="text-slate-500 hover:text-slate-300 transition-colors p-1">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <!-- Task List Container (Drop Zone) -->
            <div class="task-list flex-1 overflow-y-auto p-3 space-y-3 min-h-[150px]" id="list-review">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Column Footer Action -->
            <div class="p-3 border-t border-slate-800/60">
                <button onclick="openAddTaskModal('review')" class="w-full py-2 px-3 text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-xl transition-all flex items-center justify-center space-x-2 border border-dashed border-slate-800 hover:border-slate-700">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add card</span>
                </button>
            </div>
        </div>

        <!-- Column: Done -->
        <div class="kanban-column shrink-0 w-80 bg-slate-900/60 backdrop-blur-md border border-slate-800/80 rounded-2xl flex flex-col max-h-full shadow-xl" data-column="done">
            <!-- Column Header -->
            <div class="p-4 border-b border-slate-800/60 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
                    <h2 class="font-semibold text-sm tracking-wide text-slate-200">Done</h2>
                    <span id="count-done" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <button class="text-slate-500 hover:text-slate-300 transition-colors p-1">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <!-- Task List Container (Drop Zone) -->
            <div class="task-list flex-1 overflow-y-auto p-3 space-y-3 min-h-[150px]" id="list-done">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Column Footer Action -->
            <div class="p-3 border-t border-slate-800/60">
                <button onclick="openAddTaskModal('done')" class="w-full py-2 px-3 text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-xl transition-all flex items-center justify-center space-x-2 border border-dashed border-slate-800 hover:border-slate-700">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>Add card</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Task Modal (Create / Edit) -->
    <div id="task-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-white">Create New Task</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="task-form" onsubmit="handleTaskFormSubmit(event)">
                <input type="hidden" id="task-id">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Task Title</label>
                        <input type="text" id="task-title" required placeholder="e.g., Design Landing Page" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Description</label>
                        <textarea id="task-desc" rows="3" placeholder="Detailed task information..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Column</label>
                            <select id="task-column" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors text-sm">
                                <option value="todo">To Do</option>
                                <option value="in-progress">In Progress</option>
                                <option value="review">Review</option>
                                <option value="done">Done</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Priority</label>
                            <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors text-sm">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex items-center justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2 rounded-xl shadow-lg shadow-indigo-600/20 transition-all">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript App Entry -->
    <script src="script.js"></script>
</body>
</html>
